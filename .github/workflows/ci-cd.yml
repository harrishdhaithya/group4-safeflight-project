name: CI/CD Pipeline

on:
  push:
    branches:
      - SAFEFLIGHT_*
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: harrishka/safeflight

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: safeflight
          POSTGRES_USER: safeflight
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'oracle'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'npm'
          cache-dependency-path: 'src/main/webapp/package-lock.json'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        env:
          SPRING_DATASOURCE_USERNAME: safeflight
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: ./gradlew test
        continue-on-error: true

      - name: Build Application
        env:
          SPRING_DATASOURCE_USERNAME: safeflight
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: ./gradlew build -x test

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar
          retention-days: 7

  docker-build-push:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: build/libs

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image with docker compose
        run: |
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }} IMAGE_NAME=${{ env.IMAGE_NAME }} docker compose -f docker-compose.yml build app

      - name: Push Docker image with docker compose
        run: |
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }} IMAGE_NAME=${{ env.IMAGE_NAME }} docker compose -f docker-compose.yml push app