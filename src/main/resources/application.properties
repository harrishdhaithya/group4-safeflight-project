spring.application.name=safeflight

# Default PostgreSQL datasource configuration (can be overridden by env vars)
spring.datasource.url=jdbc:postgresql://localhost:5433/safeflight
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:safeflight}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:safeflight}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
