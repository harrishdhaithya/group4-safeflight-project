plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.0.1'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.1.5'
    id 'org.owasp.dependencycheck' version '12.2.1'
}

group = 'com.safelight'
version = '0.0.1-SNAPSHOT'
description = 'Flight Ticket Booking System'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

spotbugs {
    toolVersion = '4.8.6'
    ignoreFailures = true
}

dependencyCheck {
    format = 'HTML'
    outputDirectory = 'build/reports/dependency-check'
    nvd {
        apiKey = '828f2cc6-7473-4975-8845-9453d20009ea'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot starters - exclude default Logback
    implementation('org.springframework.boot:spring-boot-starter') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    implementation('org.springframework.boot:spring-boot-starter-data-jpa') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }

    // Add Log4j2
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    // PostgreSQL JDBC driver
    runtimeOnly 'org.postgresql:postgresql'

    // iText 7 for PDF ticket export
    implementation 'com.itextpdf:itext7-core:7.2.5'

    // Jackson for JSON parsing in controllers
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Test dependencies - exclude conflicting loggers
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
    testImplementation('org.springframework.boot:spring-boot-starter-webmvc-test') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
    testImplementation('org.springframework.boot:spring-boot-starter-log4j2') {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

// Node.js configuration
node {
    version = '24.13.0'  // Latest LTS version
    npmVersion = '11.6.2'  // Comes with Node 24.13.0
    download = true
    workDir = file("${layout.buildDirectory.get()}/nodejs")
    npmWorkDir = file("${layout.buildDirectory.get()}/npm")
    nodeProjectDir = file("${project.projectDir}/src/main/webapp")
}

// Build React application (uses the plugin's npmInstall automatically)
tasks.register('npmBuild', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn tasks.named('npmInstall')
    description = 'Build React application'
    args.set(['run', 'build'])
    inputs.dir('src/main/webapp/src')
    inputs.dir('src/main/webapp/public')
    inputs.file('src/main/webapp/package.json')
    outputs.dir('src/main/webapp/build')
}

def generatedFrontendStaticDir = layout.buildDirectory.dir('generated/frontend-static')

// Copy React build output to generated build resources
tasks.register('copyReactBuild', Copy) {
    dependsOn npmBuild
    description = 'Copy React build to generated static resources'
    from 'src/main/webapp/build'
    into generatedFrontendStaticDir
}

// Clean React build artifacts
tasks.register('cleanReactBuild', Delete) {
    description = 'Clean React build artifacts'
    delete 'src/main/webapp/build'
    delete 'src/main/webapp/node_modules'
    delete layout.buildDirectory.dir('generated/frontend-static')
}

// Hook into Gradle lifecycle
tasks.named('clean') {
    dependsOn cleanReactBuild
}

tasks.named('bootJar') {
    dependsOn copyReactBuild
}

tasks.named('bootRun') {
    dependsOn copyReactBuild
}

tasks.named('processResources') {
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    from(generatedFrontendStaticDir) {
        into 'static'
    }
    mustRunAfter(tasks.named('copyReactBuild'))
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('unitTest', Test) {
    description = 'Runs backend unit tests only'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    exclude '**/*IntegrationTest.class'
    reports {
        junitXml.required = true
        html.required = true
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs backend integration tests only'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IntegrationTest.class'
    shouldRunAfter tasks.named('unitTest')
    reports {
        junitXml.required = true
        html.required = true
    }
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs tests and generates JaCoCo coverage reports'
    dependsOn tasks.named('test'), tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            enabled = true
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.50
            }
        }
    }
}

tasks.register('coverageCheck') {
    group = 'verification'
    description = 'Fails build if coverage threshold is not met'
    dependsOn tasks.named('test'), tasks.named('jacocoTestCoverageVerification')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
    reports {
        html {
            required = true
        }
    }
}